[build-system]
requires = ["setuptools>=61.0.0", "wheel","versioneer>=0.28"]
build-backend = "setuptools.build_meta"

[project]
name = "LBM"
version = "0.1.0"
description = "LBM using Taichi for biomass pyrolysis simulation"
authors = [
    {name = "ZeshiYUE", email = "609190542@qq.com"},
]
readme = "README.rst"
requires-python = "==3.12.*"
license = { text = "MIT" }
dependencies = [
    "click",
    "numpy",
    "taichi",
    "matplotlib",
    "pyevtk",
    "pytest",
    "setuptools",
    "ruamel-yaml>=0.18.16",
    "typing-extensions>=4.15.0",
    "cantera>=3.2.0",
    "torchvision>=0.24.1",
    "torch>=2.9.1",
    "rtree>=1.4.1",
    "pyvista>=0.46.4",
    "scipy>=1.16.3",
    "sphinx>=9.0.4",
    "cadquery>=2.6.1",
]

[project.scripts]
lbm = "LBM.cli:run"
paraLbm = "LBM.cli:paraview"
ck2yaml = "LBM.cantera_tool.ck2yaml:main"
cti2yaml = "LBM.cantera_tool.cti2yaml:main"
cmtl2yaml = "LBM.cantera_tool.cmtl2yaml:main"


# [project.urls]
# Homepage = "https://github.com/lettucecfd/lettuce"

[tool.setuptools.packages.find]
where = ["src"]  # 在 src 目录中查找
include = ["LBM*"]  # 只包含 LBM 包

[tool.uv]
# 使用国内镜像
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

# 对于 PyTorch 使用官方源作为额外源
extra-index-url = [
    # "https://download.pytorch.org/whl/cu118",
    "https://mirrors.aliyun.com/pypi/simple/",  # 阿里云备份
]
