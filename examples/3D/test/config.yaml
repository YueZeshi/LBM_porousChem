basic:
  name      : test
  author    : Sylvain
  date      : 2025-12-21
  dimension : 3
  arch      : cpu
  type      : configuration 

module : 
  flow : true


spaceControl:
  geometry : [0.5,0.1,0.1]
  DX : 1e-3


timeControl:
  startTime : 0
  endTime : 1000
  DT : 1e-3

flowProperties:
  viscosity : 0.1


geometry:
  zone1:
    type : sphere
    center : [0.1,0.05,0.05]
    radius : 0.01
  zone2 :
    type : cylinder
    center : [0.2,0.05,0.05]
    radius : 0.02
    height : 0.01
    axis : [0,1,0]
  zone3 :
    type : box
    center : [0.3,0.05,0.05]
    size : [0.02,0.01,0.01]
  zone4 : 
    type : cone
    center : [0.4,0.05,0.05]
    height : 0.1
    radius : 0.02
    axis : [0,0.5,0.5]
  zone5:
    type : stl
    path : stl/cylinder_test2.stl
    scale : 1
    translate : [0.3,0.05,0.05]
    rotate : [0,0,0]

initialCondition:
  solid:
    solid1:
      zone : ALL
      type : concrete
  flow:
    rho : 1
    velocity : [0,0,0]

boundaryCondition:
  left:
    flow:
      type: inlet
      velocity : [0.01,0,0]
  right:
    flow:
      type: outlet
      rho: 1
  down:
    flow:
      type: wall
  up:
    flow:
      type : wall
  forward : 
    flow:
      type: wall
  back : 
    flow:
      type: wall


outputControl:
  vtk:
    interval : 10
    path : vtk
    LOD : 1
    clear : true
  log:
    interval : 1
    LOD : 1
  snapshot:
    interval : 100
    path : snapshot