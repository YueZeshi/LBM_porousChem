basic:
  name      : cylinder
  author    : Sylvain
  date      : 2025-12-21
  dimension : 3
  arch      : cuda
  type      : configuration 

module : 
  flow : true


spaceControl:
  geometry : [0.5,0.1,0.1]
  DX : 1e-3


timeControl:
  startTime : 0
  endTime : 1000
  DT : 1e-3

flowProperties:
  viscosity : 
    type : constant
    value : 1e-5

geometry:
  zone2:
    type : stl
    path : stl/cylinder_test2.stl
    scale : 1
    translate : [0.2,0.05,0.05]
    rotate : [0,90,0]

initialCondition:
  solid:
    solid1:
      zone : ALL
      type : concrete
  flow:
    rho : 1
    velocity : [0,0,0]

boundaryCondition:
  left:
    flow:
      type: inlet
      velocity : [0.01,0,0]
  right:
    flow:
      type: outlet
      rho: 1
  down:
    flow:
      type: wall
  up:
    flow:
      type : wall
  forward : 
    flow:
      type: wall
  back : 
    flow:
      type: wall


outputControl:
  vtk:
    interval : 100
    path : vtk
    LOD : 1
    clear : true
  log:
    interval : 1
    LOD : 1
  snapshot:
    interval : 100
    path : snapshot