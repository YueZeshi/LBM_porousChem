basic:
  name      : thermal_diffusion
  author    : Sylvain
  date      : 2025-12-19
  dimension : 2
  arch      : cpu
  type      : configuration 

module : 
  flow : true
  chemistry : false
  temperature : true
  porous_media : false
  radiation : false


spaceControl:
  geometry : [0.2,0.1]
  DX : 1e-3


timeControl:
  startTime : 0
  endTime : 1000
  DT : 1e-3

flowProperties:
  viscosity : 0.01

thermalProperties:
  gas:
    thermalDiffusivity : 
      type : fixedValue # calculated
      value : 1e-5
    thermalCapacity : 
      type : fixedValue # NASA7
      value : 1000
  # solid:
  #   type : fixThermalDiffusitivity # fixed thermal diff; fixed thermal conductivity;

boundaryCondition:
  left:
    flow:
      type: inlet
      velocity : [0.01,0,0]
    temperatureGas:
      type: fixedValue
      value : 300
  right:
    flow:
      type: outlet
    temperatureGas :
      type : zeroGradient
  down:
    flow:
      type: wall
    temperatureGas :
      type : fixedValue
      value : 300
  up:
    flow:
      type : wall
    temperatureGas :
      type : fixedValue
      value : 300
  
initialCondition:
  flow:
    rho : 1
    velocity : [0,0,0]
  solid:
    zone : ALL
    porosity : 0.5
  

outputControl:
  vtk:
    interval : 10
    path : vtk
    LOD : 1
    clear : true
  log:
    interval : 10
    LOD : 1
  snapshot:
    interval : 100
    path : snapshot